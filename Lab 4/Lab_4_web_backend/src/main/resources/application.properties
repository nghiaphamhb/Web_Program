# Port để chạy Spring Boot server
server.port=8081 

# Cấu hình PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:12345/postgres
spring.datasource.username=postgres
spring.datasource.password=np1612
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true  
spring.jpa.properties.hibernate.format_sql=true  # Format log SQL dễ đọc

# Xử lý lỗi
server.error.include-message=always
